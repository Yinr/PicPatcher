name: Release

on:
  push:
    branches:
      - "ci/**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: ubuntu-latest

    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --locked --target x86_64-pc-windows-gnu

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: PicPatcher-windows-x64-exe-${{ github.run_id }}
          path: |
            target/x86_64-pc-windows-gnu/release/picpatcher.exe
            target/x86_64-pc-windows-gnu/release/picpatcher-gui.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/x86_64-pc-windows-gnu/release/picpatcher.exe
            target/x86_64-pc-windows-gnu/release/picpatcher-gui.exe
          generate_release_notes: true
