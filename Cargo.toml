[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui", "crates/winres-build"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["PicPatcher contributors"]
repository = "https://github.com/Yinr/PicPatcher"
homepage = "https://github.com/Yinr/PicPatcher"
readme = "README.md"
rust-version = "1.75"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
walkdir = "2"
rayon = "1"
winres = "0.1"
sys-locale = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
