[package]
name = "picpatcher-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PicPatcher GUI: visually place overlays and export a runnable config for the CLI."
keywords = ["image", "gui", "overlay", "egui"]
categories = ["gui", "multimedia::images"]

[[bin]]
name = "picpatcher-gui"
path = "src/main.rs"

[dependencies]
picpatcher-core = { path = "../core" }
anyhow = { workspace = true }
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["image"] }
image = { workspace = true }
rfd = "0.14"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
picpatcher-winres-build = { path = "../winres-build" }
